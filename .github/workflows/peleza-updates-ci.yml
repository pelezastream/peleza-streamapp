name: PELEZA UPDATES - APK and AAB
on:
  push:
    branches:
      - peleza-updates-android-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PELEZA UPDATES branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile APK and AAB
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease

      - name: Package PELEZA UPDATES files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PELEZA-UPDATES-v1.0-TEST.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/PELEZA-UPDATES-v1.0-UNSIGNED.aab
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt
          ls -lh

      - name: Upload built APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: PELEZA-UPDATES-Android-Build
          path: dist/
          retention-days: 30
          if-no-files-found: error
