name: PELEZA UPDATES - APK and AAB
on:
  push:
    branches:
      - peleza-updates-android-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PELEZA_UPDATES_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.PELEZA_UPDATES_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.PELEZA_UPDATES_KEY_PASSWORD }}
    steps:
      - name: Checkout PELEZA UPDATES branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Peleza Updates upload key when configured
        shell: bash
        env:
          UPDATES_KEYSTORE_BASE64: ${{ secrets.PELEZA_UPDATES_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${UPDATES_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            printf "%s" "$UPDATES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/peleza-updates-upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/peleza-updates-upload.jks" >> "$GITHUB_ENV"
            echo "UPLOAD_KEY_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "No Peleza Updates signing secrets: release AAB will be unsigned."
          fi

      - name: Compile APK and AAB
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease

      - name: Package PELEZA UPDATES files
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PELEZA-UPDATES-v1.0.1-TEST.apk
          if [[ "${UPLOAD_KEY_PRESENT:-}" == "true" ]]; then
            cp app/build/outputs/bundle/release/app-release.aab dist/PELEZA-UPDATES-v1.0.1-SIGNED.aab
          else
            cp app/build/outputs/bundle/release/app-release.aab dist/PELEZA-UPDATES-v1.0.1-UNSIGNED.aab
          fi
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt
          ls -lh

      - name: Upload built APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: PELEZA-UPDATES-Android-v1.0.1
          path: dist/
          retention-days: 30
          if-no-files-found: error
