<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Peleza Stream</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 30%,#350006 0,#100004 34%,#050507 70%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:28px}.card{width:min(92vw,520px);text-align:center;background:rgba(20,20,23,.92);border:1px solid #2b2b31;border-radius:24px;padding:38px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.mark{position:relative;width:92px;height:92px;margin:0 auto 18px;font-size:82px;line-height:92px;font-style:italic;font-weight:950;color:#e50914}.play{position:absolute;left:45px;top:34px;width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:21px solid #fff}.brand{font-weight:900;letter-spacing:.08em;color:#ff252f;margin-bottom:18px}.brand span{color:#fff;font-size:.72em;letter-spacing:.28em;margin-left:.4em}h1{font-size:25px;margin:0 0 10px}p{color:#b9b9c0;line-height:1.55;margin:12px 0 24px}button{border:0;border-radius:999px;background:#e50914;color:#fff;font-weight:800;font-size:16px;padding:13px 26px}.small{font-size:12px;color:#7c7c84;margin-top:18px}</style></head><body><main class="card"><div class="mark">P<span class="play"></span></div><div class="brand">PELEZA <span>STREAM</span></div><h1>Peleza Stream is taking longer than expected</h1><p>Check your internet connection and try again. If the service is temporarily busy, the app will reconnect when Peleza Stream responds.</p><button onclick="location.href='https://www.pelezastream.com/'">Try again</button><div class="small">Peleza Stream Android</div></main></body></html>
